# compose.yaml — Orquestación local y de producción
#
# REQUISITOS PREVIOS:
#   1. Copia .env.example → .env y rellena todos los valores reales.
#   2. Define DOCKER_USER en tu .env o shell (ej. export DOCKER_USER=tuusuario).
#
# USO:
#   docker compose up -d
#   docker compose logs -f api
#   docker compose down        # Detiene contenedores (preserva el volumen de datos)
#   docker compose down -v     # ⚠️ Detiene Y elimina el volumen (pérdida de datos)

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aguafix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No se publican puertos al host: solo accesible dentro de la red interna
    networks:
      - aguafix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── API (imagen publicada en Docker Hub) ───────────────────────────────────
  api:
    # Imagen publicada: docker.io/<DOCKER_USER>/agua-fix-api:latest
    # Define DOCKER_USER en tu .env o como variable de shell.
    image: ${DOCKER_USER}/agua-fix-api:latest
    container_name: aguafix-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "${PORT:-3000}"
      # Base de datos — el hostname coincide con el nombre del servicio
      DB_HOST: postgres
      DB_PORT: "${DB_PORT:-5432}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      # Correo
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USER: "${MAIL_USER}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_FROM: "${MAIL_FROM}"
      MAIL_TO: "${MAIL_TO}"
      # AWS S3
      AWS_REGION: "${AWS_REGION}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      # Opcional: URL pública del bucket (CloudFront u otro CDN)
      AWS_S3_PUBLIC_BASE_URL: "${AWS_S3_PUBLIC_BASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aguafix-net

volumes:
  postgres_data:
    name: aguafix-postgres-data

networks:
  aguafix-net:
    name: aguafix-network
