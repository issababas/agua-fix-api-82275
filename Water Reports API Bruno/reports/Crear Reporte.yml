info:
  name: Crear Reporte
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/reports
  body:
    type: multipartForm
    params:
      - name: address
        value: "Calle Falsa 123, Guanajuato"
        enabled: true
      - name: description
        value: "Fuga de agua visible en la banqueta, flujo constante"
        enabled: true
      - name: severity
        value: "high"
        enabled: true
      - name: reporterPhone
        value: "4771234567"
        enabled: true
      - name: photo
        value: ""
        type: file
        enabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

# INSTRUCCIONES BRUNO:
# 1. Abre este request en Bruno.
# 2. En el campo "photo" (tipo file), selecciona un archivo JPEG, PNG o WebP (max 5 MB).
# 3. Envía el request.
# Respuesta esperada 201: { id, address, description, severity, reporterPhone, photoUrl, repairPhotoUrl, isResolved, createdAt }
# Respuesta esperada 400: si falta la foto o el MIME no es válido.
