info:
  name: Crear Reporte
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/reports
  body:
    type: json
    data: |-
      {
        "address": "Blvd. Campestre #250, León, Guanajuato",
        "description": "Hay una fuga considerable de agua en la vía pública.",
        "severity": "high",
        "reporterPhone": "4771234567"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
