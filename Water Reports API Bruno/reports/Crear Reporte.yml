info:
  name: Crear Reporte
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/reports
  body:
    type: json
    data: |-
      {
        "address": "Calle falsa",
        "description": "Fuga",
        "severity": "super-high",
